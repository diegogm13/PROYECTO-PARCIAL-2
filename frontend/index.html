<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | SA</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="center">
    <form class="card" id="login-form" data-testid="login-form" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Sistema de administración de usuarios</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" data-testid="login-email" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             data-testid="login-password" required>

      <button class="block" type="submit" data-testid="login-submit">Entrar</button>
      <div id="alert" class="alert hidden" role="alert" data-testid="login-alert"></div>

      <p class="links">¿No tienes cuenta? <a href="/register.html" data-testid="go-register">Regístrate</a></p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (session.token) window.location.href = "/users.html";

    const form = document.getElementById("login-form");
    const alertBox = document.getElementById("alert");
    const params = new URLSearchParams(window.location.search);
    if (params.get("registered")) showAlert(alertBox, "Cuenta creada. Ya puedes iniciar sesión.", "success");
    if (params.get("expired")) showAlert(alertBox, "Tu sesión expiró. Inicia sesión de nuevo.");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertBox);
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: { email: form.email.value, password: form.password.value },
        });
        session.save(data.token, data.user);
        window.location.href = "/users.html";
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
