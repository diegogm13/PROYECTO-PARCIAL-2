global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Recursos de la EC2: CPU, RAM, ancho de banda, disco y temperatura
  - job_name: ec2-node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: ec2

  # Métricas de la aplicación (latencia, peticiones/s, errores por endpoint) vía otel-collector
  - job_name: sa-backend
    static_configs:
      - targets: ["otel-collector:8889"]
